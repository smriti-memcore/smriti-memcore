# Smithery configuration file for smriti-memcore
# See https://smithery.ai/docs for schema details

startCommand:
  type: stdio
  commandFunction: |-
    (config) => ({
      command: 'uvx',
      args: ['smriti-memcore']
    })

configSchema:
  type: object
  properties:
    SMRITI_LLM_MODEL:
      type: string
      description: "LLM model name for memory operations (default: mistral)"
      default: "mistral"

exampleConfig:
  SMRITI_LLM_MODEL: "mistral"
